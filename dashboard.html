{% extends "base.html" %}
{% block content %}

<!-- 🔥 HERO -->
<div class="hero">
  <h1>AI Cybersecurity Dashboard</h1>
  <p>Real-time Threat Monitoring System</p>
</div>

<!-- 🖼️ SLIDER -->
<div class="slider">
  <div class="slides">
    <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b">
    <img src="https://images.unsplash.com/photo-1510511459019-5dda7724fd87">
    <img src="https://images.unsplash.com/photo-1581090700227-1e8f1d4f1d45">
  </div>
</div>

<!-- 🔴 ALERT -->
{% if stats.failed > 3 %}
<div class="alert">⚠️ Live Attack Detected</div>
{% endif %}

<!-- 📊 CARDS -->
<div class="cards">
  <div class="card">
    <h3>Total</h3>
    <h2>{{ stats.total }}</h2>
  </div>

  <div class="card">
    <h3>Failed</h3>
    <h2>{{ stats.failed }}</h2>
  </div>

  <div class="card">
    <h3>Blocked</h3>
    <h2>{{ stats.blocked }}</h2>
  </div>
</div>

<!-- 📈 CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById('chart'), {
 type:'line',
 data:{
  labels:['Total','Failed','Blocked'],
  datasets:[{
    data:[{{stats.total}},{{stats.failed}},{{stats.blocked}}],
    borderColor:'#3b82f6'
  }]
 }
});

// 🔔 POPUP
if({{stats.failed}}>3){
 alert("⚠️ Threat detected!");
}
</script>

<!-- 🎨 STYLE -->
<style>

.hero{
 text-align:center;
 margin-bottom:20px;
}

.slider{
 overflow:hidden;
 border-radius:15px;
}

.slides{
 display:flex;
 animation:slide 10s infinite;
}

.slides img{
 width:100%;
 height:250px;
 object-fit:cover;
}

@keyframes slide{
 0%{transform:translateX(0);}
 50%{transform:translateX(-100%);}
 100%{transform:translateX(0);}
}

.cards{
 display:flex;
 justify-content:center;
 gap:20px;
 margin:20px;
 flex-wrap:wrap;
}

.card{
 background:rgba(255,255,255,0.05);
 backdrop-filter:blur(10px);
 padding:20px;
 border-radius:15px;
 width:200px;
 text-align:center;
 transition:0.3s;
}

.card:hover{
 transform:translateY(-10px);
 box-shadow:0 0 20px #3b82f6;
}

.alert{
 text-align:center;
 color:red;
 animation:blink 1s infinite;
}

@keyframes blink{
 50%{opacity:0;}
}

canvas{
 width:80% !important;
 margin:30px auto;
 display:block;
}

</style>

{% endblock %}
